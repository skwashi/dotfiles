# See https://wiki.hyprland.org/Configuring/Binds/

$mod = SUPER

# Programs
$terminal = alacritty # kitty, foot
$fileManager = thunar # dolphin
$emacs = emacsclient -c
$menu = fuzzel -p "run "
$dmenu = rofi -show run
$ssh = rofi -show ssh
$yank = cliphist list | fuzzel --dmenu --with-nth 2 -w 80 -l 12 -p "clipboard " | cliphist decode | wl-copy
$windows = rofi -show window

# Basic binds
bind = CTRL_ALT, Backspace, exit,
bind = $mod SHIFT, R, exec, hyprctl reload
bind = $mod SHIFT, C, killactive,
bind = $mod SHIFT, Q, exec, hyprlock

# Scratchpad workspace
# bind = $mod, S, togglespecialworkspace, magic
# bind = $mod SHIFT, S, movetoworkspace, special:magic

# Workspace switching
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to workspace without following
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Scroll through windows
bind = $mod, TAB, cyclenext, tiled
bind = $mod SHIFT, TAB, cyclenext, tiled, prev

# Focus windows
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# Move windows
bind = $mod CTRL, H, movewindow, l
bind = $mod CTRL, J, movewindow, d
bind = $mod CTRL, K, movewindow, u
bind = $mod CTRL, L, movewindow, r

# Resize master
bind = $mod SHIFT, H, resizeactive, -20 0
bind = $mod SHIFT, L, resizeactive, 20 0
bind = $mod SHIFT, J, resizeactive, 0 20
bind = $mod SHIFT, K, resizeactive, 0 -20

# Swap window with master
bind = $mod SHIFT, Return, layoutmsg, swapwithmaster

# Move/resize windows with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Fullscreen (instead of layout cycling)
bind = $mod SHIFT, Space, fullscreen

# Float window
bind = $mod, M, togglefloating,

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Scratch terminals
bind = $mod, I, exec, ~/.config/hypr/scripts/toggle-scratch scratch-up "alacritty --title scratch-up"
bind = $mod, O, exec, ~/.config/hypr/scripts/toggle-scratch scratch-down "alacritty --title scratch-down"

# Launch programs
bind = $mod, E, exec, $emacs
bind = $mod, Return, exec, $terminal
bind = $mod, D, exec, $dmenu
bind = $mod, R, exec, $menu
bind = $mod, F, exec, $fileManager

# Screenshots
bind = , Print, exec, grim ~/Pictures/screenshots/screenshot-$(date +%Y%m%d-%H%M%S).png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshots/region-$(date +%Y%m%d-%H%M%S).png

# Dwindle layout
bind = $mod, P, pseudo, # dwindle
# bind = $mod, S, togglesplit, # dwindle

# Layout switching (should be a submenu)
bind = $mod SHIFT, T, exec, hyprctl keyword general:layout master
bind = $mod SHIFT, Y, exec, hyprctl keyword general:layout dwindle
# bind = $mod SHIFT, U, exec, hyprctl keyword general:layout scrolling
bind = $mod SHIFT, U, exec, hyprctl keyword general:layout monocle

# Dmenu like launchers
bind = $mod, Y, exec, $yank
bind = $mod, W, exec, $windows
bind = $mod, S, exec, $ssh
